name: VideoPedal
options:
  bundleIdPrefix: dev.castdrian.videopedal
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_TEAM: "L988J7YMK5"
    CODE_SIGN_STYLE: Automatic

targets:
  VideoPedal:
    type: application
    platform: macOS
    bundleIdPrefix: dev.castdrian.videopedal
    sources:
      - path: VideoPedal
      - path: Shared
    info:
      path: VideoPedal/Info.plist
      properties:
        CFBundleDisplayName: videopedal
        LSMinimumSystemVersion: "14.0"
        LSUIElement: false
        NSCameraUsageDescription: videopedal captures your webcam to record and loop clips that are published as a virtual camera.
    entitlements:
      path: VideoPedal/VideoPedal.entitlements
      properties:
        # Not sandboxed: a session-wide CGEventTap for the global pedal/live hotkeys is
        # rejected by the sandbox regardless of Input Monitoring TCC approval. Fine for a
        # GitHub-distributed app (sandbox is only mandatory for Mac App Store distribution).
        com.apple.security.app-sandbox: false
        com.apple.security.device.camera: true
        com.apple.security.application-groups:
          - group.dev.castdrian.videopedal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.castdrian.videopedal
        PRODUCT_NAME: videopedal
        EXECUTABLE_NAME: videopedal
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        GENERATE_INFOPLIST_FILE: false
        ENABLE_HARDENED_RUNTIME: true
        COMBINE_HIDPI_IMAGES: true
        SWIFT_OBJC_BRIDGING_HEADER: VideoPedal/OBSVirtualCamera.h
    dependencies:
      - sdk: CoreMediaIO.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework

schemes:
  VideoPedal:
    build:
      targets:
        VideoPedal: all
    run:
      config: Debug
